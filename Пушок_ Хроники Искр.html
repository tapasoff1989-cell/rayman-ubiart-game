let audioCtx = null, musicMaster = null, musicBus = null, muffle = null, padNodes = null, noiseBuf = null;
const music = { on:false, step:0, nextTime:0, timer:null, tempo:92, drums:0, duck:1 };
function ensureAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            musicMaster = audioCtx.createGain(); musicMaster.gain.value = 0; musicMaster.connect(audioCtx.destination);
            muffle = audioCtx.createBiquadFilter(); muffle.type = 'lowpass'; muffle.frequency.value = 18000; muffle.connect(musicMaster);
            musicBus = audioCtx.createGain(); musicBus.gain.value = 1; musicBus.connect(muffle);
            const delay = audioCtx.createDelay(1.0); delay.delayTime.value = 0.36;
            const fb = audioCtx.createGain(); fb.gain.value = 0.34;
            const wet = audioCtx.createGain(); wet.gain.value = 0.5;
            musicBus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(muffle);
            noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
            const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && !music.on && settings.music) startMusic();
}
['keydown','touchstart','mousedown','pointerdown'].forEach(ev => window.addEventListener(ev, ensureAudio, { passive:true }));

function playTone(freq, dur=0.08, type='sine', gain=0.06) {
    if (!audioCtx || !settings.sound) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq*0.5), t+dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+dur+0.02);
}
function playNoise(dur=0.08, gain=0.05, filterFreq=1000, dest) {
    if (!audioCtx || (!settings.sound && !dest) || !noiseBuf) return;
    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
    const filter = audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=filterFreq; filter.Q.value=1.5;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(filter); filter.connect(g); g.connect(dest || audioCtx.destination);
    src.start(t, Math.random()*0.5); src.stop(t+dur+0.02);
}
function playVoice(pitch=1) {
    if (!audioCtx || !settings.sound) return;
    const t = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator(); osc1.type='triangle'; osc1.frequency.value = 440*pitch;
    const osc2 = audioCtx.createOscillator(); osc2.type='sine'; osc2.frequency.value = 880*pitch;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    osc1.connect(g); osc2.connect(g); g.connect(audioCtx.destination);
    osc1.start(t); osc1.stop(t+0.17); osc2.start(t); osc2.stop(t+0.17);
}

// Музыка
function musicNote(freq, t, dur, type, gain, dest) {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);

const ARP_PATTERNS = [[0,2,1,3,2,1,3,2],[0,1,2,3,2,3,1,2],[3,1,2,0,2,1,3,1],[0,3,1,2,3,2,1,0]];
function playMusicStep(step, t, spb) {
    const chord = (currentLevel && currentLevel.melody) || [130.81, 164.81, 196.0, 261.63];
    const bar = Math.floor(step / 8), s8 = step % 8;
    const pat = ARP_PATTERNS[bar % 4];
    const hush = music.duck;
    // арпеджио (две октавы выше аккордового пада), чередуем тембр по тактам

function scheduleMusic() {

    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=320; lfo.connect(lfoGain); lfoGain.connect(filter.frequency); lfo.start();

        player.vy = climb;
        player.x += (v.x + v.w/2 - player.w/2 - player.x) * 0.35;
        if (climb !== 0) { progress.stats.vine += Math.abs(climb) * dt; if (progress.stats.vine >= 600) unlock('climb'); player.walkPhase += dt * 0.12; }
        if (player.y + player.h * 0.55 < v.y) { player.onVine = null; player.vineCooldown = 20; player.vy = -9; }   // перемахнуть через верх
    } else if (player.isUnderwater) {
        player.isHovering = false; refillAir();
        player.coyoteTimer = 0; player.jumpBuffer = 0;
        if (keys.jump) {
            player.vy -= 0.55 * dt; if (player.vy < -5) player.vy = -5;
            if (Math.random() < 0.08) addBubble(player.x+player.w/2+(Math.random()-0.5)*16, player.y+player.h/2);
            if (Math.random() < 0.02) sfx.swim();
        } else if (keys.down) { player.vy += 0.55 * dt; if (player.vy > 5) player.vy = 5; }
        else { player.vy -= 0.06 * dt; if (player.vy < -1.2) player.vy = -1.2; }
        player.vy *= (1 - 0.04 * dt);
    } else {
        if (jumpEdge) player.jumpBuffer = 8; else if (player.jumpBuffer > 0) player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
        if (player.isGrounded) { refillAir(); player.coyoteTimer = 8; }
        else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

        if (player.jumpBuffer > 0) {
            if (!player.isGrounded && player.wallTimer > 0 && player.wallJumpCooldown <= 0) {
                // прыжок от стены — теперь отталкивает В СТОРОНУ ОТ СТЕНЫ
                player.vy = player.jumpForce * 0.95; player.vx = -player.wallDir * 8.5; player.facing = -player.wallDir;
                player.lockTimer = 9; player.wallJumpCooldown = 12; player.canCut = false;
                player.squashX = 0.6; player.squashY = 1.5; sfx.wall();
                addParticles(player.x + player.w/2 + player.wallDir*18, player.y+player.h/2, 16, '#34d399', 10, true);
                player.jumpBuffer = 0; player.coyoteTimer = 0; player.isHovering = false; player.wallTimer = 0;
            } else if (player.coyoteTimer > 0) {
                player.vy = player.jumpForce; player.canCut = true;
                addParticles(player.x+player.w/2, player.y+player.h, 16, '#34d399', 8, true); sfx.jump();
                player.isGrounded = false; player.isHovering = false; player.jumpBuffer = 0; player.coyoteTimer = 0;
                player.squashX = 0.6; player.squashY = 1.5;
            } else if (player.airJumps > 0) {
                player.airJumps--; player.vy = player.jumpForce; player.canCut = false;
                addParticles(player.x+player.w/2, player.y+player.h, 24, '#fde047', 10, true);
                sfx.doubleJump(); camera.shake = Math.max(camera.shake, 6);
                player.isHovering = false; player.jumpBuffer = 0;
                player.squashX = 0.6; player.squashY = 1.5;
            }
        }
        // короткий прыжок: отпустил рано — взлёт обрезается
        if (player.canCut && !keys.jump && player.vy < -4.5) { player.vy *= 0.55; player.canCut = false; }
        if (player.vy >= 0) player.canCut = false;

        // парение — теперь ограничено по времени (с крыльями — безлимитно)
        if (keys.jump && !player.isGrounded && player.vy > 0 && (player.hasWings || player.hoverLeft > 0)) {
            player.isHovering = true; player.vy = 0.75;
            if (!player.hasWings) player.hoverLeft -= dt;
        } else player.isHovering = false;

        if (keys.down && !player.isGrounded) { player.vy += 1.2*dt; player.isHovering = false; }
        if (!player.isHovering) player.vy += player.gravity*dt;
        if (player.vy > 18) player.vy = 18;
    }

    // ═══ ПОЗИЦИЯ + КОЛЛИЗИИ ═══
    const bossLocked = boss.cfg && boss.active && !boss.defeated;
    const prevX = player.x, prevY = player.y;
    player.x += player.vx*dt; player.y += player.vy*dt;
    if (player.x < 0) player.x = 0;
    if (player.x > camera.worldWidth - player.w) player.x = camera.worldWidth - player.w;
    if (bossLocked) player.x = clamp(player.x, boss.cfg.arenaL, boss.cfg.arenaR - player.w);

    const wasGrounded = player.isGrounded;
    player.isGrounded = false; player.onIce = false;
    let wall = 0;
    for (const plat of platforms) {
        if (plat.type === 'falling' && plat.fstate >= 2) continue;
        if (!(player.x + player.w > plat.x && player.x < plat.x + plat.w)) continue;
        const bottom = player.y + player.h, prevBottom = prevY + player.h;
        const tol = 18 + Math.abs(plat.dy || 0);
        if (player.vy >= 0 && bottom >= plat.y && prevBottom <= plat.y + tol) {
            player.y = plat.y - player.h;
            if (plat.type === 'bounce' && player.bounceCooldown <= 0) {
                player.vy = plat.bounceForce || -20; player.isHovering = false; player.canCut = false; refillAir();
                player.squashX = 0.5; player.squashY = 1.7; player.bounceCooldown = 12;
                sfx.bounce(); camera.shake = Math.max(camera.shake, 8);
                addParticles(player.x+player.w/2, player.y+player.h, 30, '#22d3ee', 14, true);
                continue;
            }
            if (!wasGrounded && player.vy > 3) { player.squashX = 1.35; player.squashY = 0.7; addParticles(player.x+player.w/2, player.y+player.h, 10, plat.type === 'ice' ? '#bae6fd' : '#065f46', 6); sfx.land(); }
            player.vy = 0; player.isGrounded = true;
            if (plat.type === 'ice') player.onIce = true;
            if (plat.type === 'moving') playerRidingPlatform = plat;
            if (plat.type === 'falling' && plat.fstate === 0) { plat.fstate = 1; plat.ftimer = 32; sfx.crumble(); showTip('falling', '🪨 Хрупкие плиты рушатся под ногами — не мешкай!'); }
            continue;
        }
        if (plat.solid && plat.type !== 'bounce') {
            if (bottom > plat.y && player.y < plat.y + plat.h) {
                if (player.vy < 0 && prevY >= plat.y + plat.h - 6) { player.y = plat.y + plat.h; player.vy = 1; }
                else if (prevX + player.w <= plat.x + 10) { player.x = plat.x - player.w; wall = 1; player.vx = 0; }
                else if (prevX >= plat.x + plat.w - 10) { player.x = plat.x + plat.w; wall = -1; player.vx = 0; }
                else {
                    const up = bottom - plat.y, l = (player.x + player.w) - plat.x, r = (plat.x + plat.w) - player.x;
                    const m = Math.min(up, l, r);
                    if (m === up) { player.y = plat.y - player.h; if (player.vy > 0) player.vy = 0; player.isGrounded = true; }
                    else if (m === l) { player.x = plat.x - player.w; wall = 1; player.vx = 0; }
                    else { player.x = plat.x + plat.w; wall = -1; player.vx = 0; }
                }
            }
        }
    }
    if (bossLocked) player.x = clamp(player.x, boss.cfg.arenaL, boss.cfg.arenaR - player.w);
    // «липкость» стены: считаем, что стена рядом, если впритык
    if (!wall && !player.isGrounded) {
        for (const plat of platforms) {
            if (!plat.solid) continue;
            if (player.y + player.h > plat.y + 4 && player.y < plat.y + plat.h) {
                if (Math.abs((player.x + player.w) - plat.x) <= 3) { wall = 1; break; }
                if (Math.abs(player.x - (plat.x + plat.w)) <= 3) { wall = -1; break; }
            }
        }
    }
    if (wall) { player.wallDir = wall; player.wallTimer = 6; } else player.wallTimer = Math.max(0, player.wallTimer - dt);
    player.sliding = false;
    if (wall && !player.isGrounded && dir === wall && player.vy > 2.2 && !player.onVine && !player.isUnderwater) {
        player.vy = 2.2; player.sliding = true;
        if (Math.random() < 0.3) addParticles(player.x + player.w/2 + wall*20, player.y + player.h*0.6, 1, '#a7f3d0', 3);
    }
    if (player.onVine && player.isGrounded && keys.down && !keys.jump) { player.onVine = null; player.vineCooldown = 15; }

    // ═══ ШИПЫ ═══
    if (player.hazardCooldown <= 0 && !testCheats.invincible) {
        hazards.forEach(h => {
            if (player.x + player.w > h.x && player.x < h.x + h.w && player.y + player.h > h.y && player.y < h.y + h.h) {
                damagePlayer(1, h.x + h.w/2, h.y);
                player.hazardCooldown = 60;
                addParticles(player.x+player.w/2, player.y+player.h, 20, '#f43f5e', 12, true);
            }
        });
    }

    checkpoints.forEach((cp, i) => {
        if (!cp.reached && player.x + player.w/2 > cp.x && Math.abs(player.y - cp.y) < 120) {
            cp.reached = true; currentCheckpoint = i;
            addParticles(cp.x, cp.y-40, 30, '#34d399', 10, true);
            sfx.lum(); camera.shake = Math.max(camera.shake, 8);
            addScorePopup(cp.x, cp.y - 80, '✔ ЧЕКПОИНТ', '#34d399');
        }
    });

    if (currentLevel.portal) {
        const p = currentLevel.portal;
        p.activated = lumsThisLevel >= activeLums.length;
        if (p.activated) {
            const dx = (player.x+player.w/2) - p.x; const dy = (player.y+player.h/2) - p.y;
            if (Math.sqrt(dx*dx + dy*dy) < p.r + 30) triggerLevelComplete();
        }
    }

    // ═══ СЕКРЕТЫ И БОНУСЫ ═══
    const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    secrets.forEach(s => {
        if (s.got) return;
        if (Math.hypot(pcx - s.x, pcy - s.y) < 40) {
            s.got = true; levelSecretGot = true;
            const first = !progress.secrets[currentLevelIndex];
            progress.secrets[currentLevelIndex] = true;
            if (first) { score += 5; addScorePopup(s.x, s.y - 16, '⭐ СЕКРЕТ! +5', '#fde68a'); }
            else addScorePopup(s.x, s.y - 16, '⭐ секрет', '#fde68a');
            for (let k = 0; k < 40; k++) addParticles(s.x, s.y, 1, ['#fde047','#ffffff','#fb923c'][k%3], 16, true);
            sfx.secret(); camera.shake = Math.max(camera.shake, 8);
            unlock('secret1'); if (Object.keys(progress.secrets).length >= 8) unlock('secret8');
            saveProgress(); updateHUD();
        }
    });
    bonuses.forEach(b => {
        if (b.got) return;
        if (Math.hypot(pcx - b.x, pcy - b.y) < 34) { b.got = true; score += 1; sfx.bonus(); addParticles(b.x, b.y, 8, '#e2e8f0', 6, true); addScorePopup(b.x, b.y - 10, '+1', '#e2e8f0'); updateHUD(); }
    });

    // ═══ ВРАГИ ═══
    for (let i = activeEnemies.length - 1; i >= 0; i--) {
        const en = activeEnemies[i];
        updateEnemy(en, dt);
        touchEnemy(activeEnemies, i, false);
    }
    for (let i = activeFlyers.length - 1; i >= 0; i--) {
        const f = activeFlyers[i];
        f.x += f.speed * f.dir * dt;
        if (f.x < f.minX || f.x > f.maxX) f.dir *= -1;
        f.phase += dt*0.06; f.y = f.baseY + Math.sin(f.phase) * f.amp;
        touchEnemy(activeFlyers, i, true);
    }
    for (let i = enemyShots.length - 1; i >= 0; i--) {
        const s = enemyShots[i];
        s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
        if (s.life <= 0 || s.x < camera.x - 120 || s.x > camera.x + VIEW_W + 120) { enemyShots.splice(i, 1); continue; }
        if (s.x + s.r > player.x && s.x - s.r < player.x + player.w && s.y + s.r > player.y && s.y - s.r < player.y + player.h) {
            if (playerDashing > 0) { addParticles(s.x, s.y, 8, '#86efac', 6, true); enemyShots.splice(i, 1); continue; }
            if (player.invulnerableTimer <= 0 && !testCheats.invincible) { damagePlayer(1, s.x, s.y); enemyShots.splice(i, 1); continue; }
        }
    }

    // сердечки
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.vy += 0.35*dt; p.y += p.vy*dt; p.bobPhase += dt*0.15; p.life -= dt;
        platforms.forEach(plat => {
            if (plat.type === 'moving' || (plat.type === 'falling' && plat.fstate >= 2)) return;
            if (p.x + p.w/2 > plat.x && p.x - p.w/2 < plat.x + plat.w && p.y + p.h/2 > plat.y && p.y + p.h/2 < plat.y + plat.h + 20 && p.vy > 0) { p.y = plat.y - p.h/2; p.vy = 0; }
        });
        if (p.vy === 0) p.y += Math.sin(p.bobPhase)*0.4;
        const dx = (player.x+player.w/2) - p.x; const dy = (player.y+player.h/2) - p.y;
        if (Math.sqrt(dx*dx + dy*dy) < 42) {
            if (lives < 5) { lives++; updateHUD(); }
            addParticles(p.x, p.y, 26, '#ef4444', 10, true);
            sfx.heart(); pickups.splice(i, 1); continue;
        }
        if (p.life <= 0 || p.y > VIEW_H + 200) pickups.splice(i, 1);
    }

    updateBoss(dt);

    // ═══ ПАДЕНИЕ В ПРОПАСТЬ ═══
    if (player.y > VIEW_H + 80) {
        if (testCheats.invincible) {
            const cp = checkpoints[currentCheckpoint];
            player.x = cp.spawnX; player.y = cp.spawnY; player.vx = 0; player.vy = 0;
            player.breath = 300; player.invulnerableTimer = 60; player.hazardCooldown = 90;
        } else if (lives > 1) {
            lives--; deathsThisRun++; deathsThisLevel++; lumCombo = 0; player.hasWings = false;
            deathFade = 1;
            updateHUD(); camera.shake = 16; flashRedTimer = 20; sfx.hurt();
            respawnAtCheckpoint();
            player.invulnerableTimer = 150; player.breath = 300; player.hazardCooldown = 90; player.bounceCooldown = 0;
        } else {
            lives = 0; deathsThisRun++; deathsThisLevel++; updateHUD();
            isGameOver = true; onGameOver(); sfx.lose();
        }
    }

    // ═══ ИСКРЫ ═══
    activeLums.forEach(lum => {
        if (!lum.collected) {
            const dx = (player.x+player.w/2) - lum.x; const dy = (player.y+player.h/2) - lum.y;
            if (dx*dx + dy*dy < 44*44) {
                lum.collected = true; score++; lumsThisLevel++;
                addParticles(lum.x, lum.y, 20, '#fde047', 8, true);
                sfx.lum();
                lumCombo++; maxCombo = Math.max(maxCombo, lumCombo);
                addScorePopup(lum.x, lum.y-10, '+1', '#fde047');
                if (lumCombo >= 5) {
                    player.hasWings = true; player.wingsTimer = 180; player.wingFlap = 0; lumCombo = 0; player.airJumps = Math.max(player.airJumps, 1);
                    sfx.wingGain(); camera.shake = Math.max(camera.shake, 10); unlock('wings');
                    for (let k = 0; k < 40; k++) addParticles(player.x+player.w/2, player.y+player.h/2, 1, ['#fde047','#fef3c7','#fffef0'][k%3], 14, true);
                    addScorePopup(player.x+player.w/2, player.y-40, '🪶 КРЫЛЬЯ!', '#fde047');
                    const cp = document.getElementById('comboPill');
                    cp.classList.add('pulse'); setTimeout(() => cp.classList.remove('pulse'), 400);
                }
                updateHUD();
                checkBossCompletion();
            }
        }
    });

    // старт боя
    if (boss.cfg && !boss.active && !boss.defeated && player.x > boss.cfg.trigger) {
        boss.active = true; bossBannerTimer = 220; boss.attackTimer = 120;
        sfx.bossRoar(); camera.shake = 20;
        document.getElementById('livesPill').classList.add('boss');
        changeMusic();
    }

    // подсказки о новых механиках
    if (Math.floor(globalTime) % 15 === 0) checkTips();

    // ═══ КАМЕРА ═══
    const targetLookAhead = player.vx * 14;
    camera.lookAhead += (targetLookAhead - camera.lookAhead) * 0.05 * dt;
    let targetCamX = player.x - camera.width/2.5 + camera.lookAhead;
    if (bossLocked) { const mid = (boss.cfg.arenaL + boss.cfg.arenaR)/2; targetCamX = mid - VIEW_W/2 + (player.x - mid) * 0.22; }
    targetCamX = Math.max(0, Math.min(targetCamX, camera.worldWidth - camera.width));
    camera.x += (targetCamX - camera.x) * 0.1 * dt;
    if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt*0.9);

    if (player.isHovering || player.hasWings) {
        player.trailTimer -= dt;
        if (player.trailTimer <= 0) { player.trailTimer = 2; trail.push({ x: player.x+player.w/2, y: player.y+20, life: 22, maxLife: 22, w: player.w*0.7, h: 14, gold: player.hasWings }); }
    }
    for (let i = trail.length - 1; i >= 0; i--) { trail[i].life -= dt; if (trail[i].life <= 0) trail.splice(i, 1); }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.1*dt; p.rot += p.rotSpeed*dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = scorePopups.length - 1; i >= 0; i--) { const sp = scorePopups[i]; sp.y -= dt*0.8; sp.life -= dt; if (sp.life <= 0) scorePopups.splice(i, 1); }

    updateWaterFX(dt); updateAmbient(dt);
}

function checkTips() {
    if (!tipsShown.ice && platforms.some(p => p.type === 'ice' && inView(p.x, p.w, -40))) showTip('ice', '❄ Лёд скользкий — тормози заранее!');
    else if (!tipsShown.vine && vines.some(v => inView(v.x, v.w, -40))) showTip('vine', '🌿 У лианы держи ▲ — лезь вверх, ▼ — вниз, ◀ ▶ — спрыгнуть');
    else if (!tipsShown.spiker && activeEnemies.some(e => e.kind === 'spiker' && inView(e.x, e.w, -40))) showTip('spiker', '⚙ Шипастых нельзя топтать — сбей их рывком (Shift)!');
    else if (!tipsShown.shooter && activeEnemies.some(e => e.kind === 'shooter' && inView(e.x, e.w, -40))) showTip('shooter', '🌱 Стрелок: прыгни на него сверху или сбей рывком');
    else if (!tipsShown.hopper && activeEnemies.some(e => e.kind === 'hopper' && inView(e.x, e.w, -40))) showTip('hopper', '🐸 Прыгуны бросаются на тебя — следи за дистанцией');
}

function respawnAtCheckpoint() {
    const cp = checkpoints[currentCheckpoint];
    player.x = cp.spawnX; player.y = cp.spawnY; player.vx = 0; player.vy = 0; player.onVine = null; player.lockTimer = 0; playerDashing = 0;
    enemyShots = [];
    if (boss.cfg && boss.active && !boss.defeated) { resetBoss(); changeMusic(); }   // бой начинается заново
    camera.x = clamp(player.x - camera.width/2.5, 0, camera.worldWidth - camera.width);
}

// ── ВРАГИ ──
function updateEnemy(en, dt) {
    switch (en.kind) {
        case 'walker':
            en.x += en.speed * en.dir * dt;
            if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;
            break;
        case 'hopper':
            if (!en.air) {
                en.x += en.speed * en.dir * dt * 0.5;
                if (en.x < en.minX) { en.x = en.minX; en.dir = 1; } else if (en.x > en.maxX) { en.x = en.maxX; en.dir = -1; }
                en.hopTimer -= dt;
                if (en.hopTimer <= 0) {
                    const dxp = (player.x + player.w/2) - (en.x + en.w/2);
                    if (Math.abs(dxp) < 420) en.dir = dxp >= 0 ? 1 : -1;
                    en.air = true; en.vyJ = -9.5; en.hopTimer = 70 + Math.random() * 40;
                }
            } else {
                en.vyJ += 0.5 * dt; en.y += en.vyJ * dt; en.x = clamp(en.x + en.dir * 3.2 * dt, en.minX, en.maxX);
                if (en.y >= en.gy - en.h) { en.y = en.gy - en.h; en.air = false; en.vyJ = 0; }
            }
            break;
        case 'spiker': en.spin += dt * 0.05; break;
        case 'shooter': {
            const cx = en.x + en.w/2, cy = en.y + en.h/2;
            const dx = (player.x + player.w/2) - cx, dy = (player.y + player.h/2) - cy;
            en.faceDir = dx < 0 ? -1 : 1;
            if (en.recoil > 0) en.recoil -= dt;
            en.cd -= dt;
            if (en.cd <= 0) {
                if (Math.abs(dx) < 520 && Math.abs(dy) < 230 && inView(en.x, en.w, -20)) {
                    const d = Math.hypot(dx, dy) || 1, sp = 4.4;
                    enemyShots.push({ x: cx + en.faceDir * 20, y: cy - 4, vx: dx / d * sp, vy: dy / d * sp, r: 8, life: 220 });
                    en.recoil = 10; sfx.shoot();
                }
                en.cd = 125;
            }
            break;
        }
    }
}
function defeatEnemy(list, i, how, isFlyer) {
    const en = list[i]; list.splice(i, 1);
    const cx = en.x + en.w/2, cy = en.y + en.h/2;
    progress.stats.kills++; if (how === 'dash') progress.stats.dashKills++;
    if (progress.stats.kills >= 10) unlock('stomp10');
    if (progress.stats.dashKills >= 5) unlock('dash5');
    saveProgress();
    addParticles(cx, cy, isFlyer ? 28 : 22, isFlyer ? '#a855f7' : (en.kind === 'spiker' ? '#94a3b8' : '#fde047'), 14, true);
    camera.shake = Math.max(camera.shake, how === 'dash' ? 8 : 10); sfx.stomp(); hitstop(how === 'dash' ? 3 : (isFlyer ? 5 : 4));
    score += 2; if (isFlyer) spawnHeart(cx, cy);
    addScorePopup(cx, en.y - 20, how === 'dash' ? '⚡ +2' : '+2', isFlyer ? '#a855f7' : '#fde047');
    updateHUD();
}
function touchEnemy(list, i, isFlyer) {
    const en = list[i];
    const ox = player.x + player.w > en.x + 6 && player.x < en.x + en.w - 6;
    const oy = player.y + player.h > en.y + 6 && player.y < en.y + en.h;
    if (!(ox && oy)) return;
    const cx = en.x + en.w/2, cy = en.y + en.h/2;

function bossCenter() { return { x: boss.x + boss.w/2, y: boss.y + boss.h/2 }; }
function bossDefeated() {
    boss.hp = 0; boss.defeated = true; boss.dyingTimer = 120; boss.projectiles = []; boss.shards = []; boss.marker = 0;
    camera.shake = 30; sfx.bossRoar(); hitstop(12);
    const c = bossCenter();
    for (let i = 0; i < 60; i++) addParticles(c.x, c.y, 1, ['#fde047','#f43f5e','#a855f7'][i%3], 20, true);
    document.getElementById('livesPill').classList.remove('boss');
    unlock(boss.kind === 'lord' ? 'lord' : 'void');
    changeMusic();
    if (lumsThisLevel < activeLums.length) tipToast = { text: '✨ Босс повержен! Собери оставшиеся искры', timer: 300 };
    else checkBossCompletion();
}
function bossTakeHit() {
    if (boss.invulnTimer > 0) return false;
    boss.hp--; boss.invulnTimer = 45; boss.hurtFlash = 12; camera.shake = 14;
    const c = bossCenter(); addParticles(c.x, boss.y, 25, '#fde047', 14, true);
    sfx.bossHit(); hitstop(6); updateHUD();
    if (boss.hp <= 0) bossDefeated();
    else if (boss.kind === 'lord') { boss.state = 'vanish'; boss.telegraph = 0; }
    return true;
}
function bossVulnerable() { return boss.kind === 'lord' ? (boss.state !== 'vanish') : boss.state === 'stunned'; }
function bossContact() {
    const bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
    const overlap = player.x + player.w > bx + 10 && player.x < bx + bw - 10 && player.y + player.h > by && player.y < by + bh;
    if (!overlap || boss.alpha < 0.7) return;
    const vul = bossVulnerable();
    if (playerDashing > 0 && vul) { if (bossTakeHit()) { playerDashing = 0; player.vx = -player.facing * 5; player.vy = -6; } return; }
    const stomp = player.vy > 0 && player.y + player.h < by + bh * 0.6;
    if (stomp) {
        if (vul && bossTakeHit()) { player.vy = -12; player.canCut = false; refillAir(); }
        else { player.vy = -10; player.canCut = false; if (!vul) { addParticles(player.x + player.w/2, by, 10, '#c4b5fd', 8, true); sfx.land(); } }
        return;
    }
    if (boss.kind === 'void' && boss.state === 'stunned') return;
    damagePlayer(1, bx + bw/2, by + bh/2);
}
function shootBossProjectile(count) {
    const c = bossCenter();
    const baseAngle = Math.atan2(player.y+player.h/2 - c.y, player.x+player.w/2 - c.x);
    for (let i = 0; i < count; i++) {
        const angle = baseAngle + (i - (count-1)/2) * 0.28;
        const speed = 3.5 + boss.phase * 0.6;
        boss.projectiles.push({ x:c.x, y:c.y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r:12, life:240, rot:0, g:0.05 });
    }
    sfx.shoot();
}
function radialBurst(n) {
    const c = bossCenter(), a0 = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++) { const a = a0 + i * Math.PI * 2 / n; boss.projectiles.push({ x:c.x, y:c.y, vx:Math.cos(a)*3.1, vy:Math.sin(a)*3.1, r:11, life:300, rot:0, g:0 }); }
    sfx.bossRoar(); camera.shake = Math.max(camera.shake, 5);
}
function bossSlam() {
    const cfg = boss.cfg, c = bossCenter();
    sfx.slam(); camera.shake = 24; hitstop(4);
    const pairs = boss.phase === 3 ? 2 : 1;
    for (let k = 0; k < pairs; k++) for (const d of [-1, 1])
        boss.projectiles.push({ x: c.x + d * (boss.w/2 + 10 + k * 95), y: cfg.groundY - 16, vx: d * 5.2, vy: 0, r: 16, life: 160, rot: 0, g: 0, wave: true });
    for (let i = 0; i < 30; i++) addParticles(c.x + (Math.random()-0.5) * boss.w, cfg.groundY - 4, 1, '#c4b5fd', 12, true);
}
function spawnShard() {
    const cfg = boss.cfg;
    boss.shards.push({ x: clamp(player.x + player.w/2 + player.vx * 12, cfg.arenaL + 30, cfg.arenaR - 30), warn: 50, strike: 0, hit: false });
}

function updateBoss(dt) {
    if (!boss.cfg) return;
    if (boss.defeated) { if (boss.dyingTimer > 0) boss.dyingTimer -= dt; return; }
    if (!boss.active) return;
    boss.t += dt;
    if (boss.invulnTimer > 0) boss.invulnTimer -= dt;
    if (boss.hurtFlash > 0) boss.hurtFlash -= dt;
    const np = boss.kind === 'lord' ? (boss.hp > 6 ? 1 : boss.hp > 3 ? 2 : boss.hp > 1 ? 3 : 4) : (boss.hp > 7 ? 1 : boss.hp > 3 ? 2 : 3);
    if (np !== boss.phase) {
        boss.phase = np; boss.invulnTimer = Math.max(boss.invulnTimer, 60); camera.shake = 25; sfx.phaseChange();
        const c = bossCenter(); for (let i = 0; i < 30; i++) addParticles(c.x, c.y, 1, '#f43f5e', 14, true);
    }
    const cfg = boss.cfg;
    if (boss.kind === 'lord') {
        boss.bobPhase += dt * 0.05;
        if (boss.state === 'idle') {
            boss.x += (boss.tx - boss.x) * 0.04 * dt;
            boss.y = boss.homeY + Math.sin(boss.bobPhase) * 14;
            boss.attackTimer -= dt * (boss.phase === 4 ? 2 : 1);
            if (boss.telegraph > 0) {
                boss.telegraph -= dt;
                if (boss.telegraph <= 0) {
                    shootBossProjectile(boss.phase === 1 ? 1 : boss.phase === 2 ? 3 : boss.phase === 3 ? 4 : 6);
                    boss.attackTimer = boss.phase === 1 ? 110 : boss.phase === 2 ? 90 : boss.phase === 3 ? 65 : 40;
                }
            } else if (boss.attackTimer <= 0 && boss.invulnTimer <= 0) boss.telegraph = boss.phase === 1 ? 45 : boss.phase === 2 ? 35 : boss.phase === 3 ? 25 : 15;
            if (boss.phase >= 3) { boss.shardTimer -= dt; if (boss.shardTimer <= 0) { spawnShard(); boss.shardTimer = boss.phase === 3 ? 170 : 110; } }
        } else if (boss.state === 'vanish') {
            boss.alpha -= dt / 18;
            if (boss.alpha <= 0) {
                boss.alpha = 0;
                const anchors = [-280, 0, 280].map(o => cfg.homeX + o - boss.w/2).filter(a => Math.abs(a - boss.x) > 60);
                boss.x = anchors[Math.floor(Math.random() * anchors.length)]; boss.tx = boss.x;
                boss.state = 'appear'; sfx.teleport();
                const c = bossCenter(); for (let i = 0; i < 20; i++) addParticles(c.x, boss.y + boss.h/2, 1, '#c084fc', 10, true);
            }
        } else if (boss.state === 'appear') {
            boss.alpha += dt / 18;
            if (boss.alpha >= 1) { boss.alpha = 1; boss.state = 'idle'; boss.attackTimer = 55; }
        }
    } else {
        const ph = boss.phase, half = (cfg.arenaR - cfg.arenaL) / 2 - boss.w / 2 - 20;
        boss.bobPhase += dt * 0.05;
        switch (boss.state) {
            case 'idle': boss.state = 'sweep'; boss.diveTimer = 260; break;
            case 'sweep': {
                const tx = cfg.homeX - boss.w/2 + Math.sin(boss.t * 0.018 * (1 + ph * 0.15)) * half;
                boss.x += (tx - boss.x) * 0.08 * dt;
                boss.y = boss.homeY + Math.sin(boss.bobPhase) * 12;
                boss.burstTimer -= dt;
                if (boss.burstTimer <= 0) { radialBurst([8, 10, 12][ph-1]); boss.burstTimer = [150, 125, 100][ph-1]; }
                boss.diveTimer -= dt;
                if (boss.diveTimer <= 0 && boss.invulnTimer <= 0) { boss.state = 'aim'; boss.stateTimer = 55; boss.marker = 1; sfx.teleport(); }
                break;
            }
            case 'aim': {
                const tx = clamp(player.x + player.w/2 - boss.w/2, cfg.arenaL + 10, cfg.arenaR - boss.w - 10);
                boss.x += (tx - boss.x) * 0.12 * dt; boss.y = boss.homeY - 10 + Math.sin(boss.t * 0.9) * 3;
                boss.stateTimer -= dt;
                if (boss.stateTimer <= 0) { boss.state = 'dive'; boss.vy = 2; boss.marker = 0; }
                break;
            }
            case 'dive':
                boss.vy += 1.3 * dt; boss.y += boss.vy * dt;
                if (boss.y + boss.h >= cfg.groundY) { boss.y = cfg.groundY - boss.h; boss.state = 'stunned'; boss.stateTimer = [115, 100, 85][ph-1]; bossSlam(); }
                break;
            case 'stunned':
                boss.stateTimer -= dt; if (boss.stateTimer <= 0) boss.state = 'rise';
                break;
            case 'rise':
                boss.y -= 4 * dt;
                if (boss.y <= boss.homeY) { boss.y = boss.homeY; boss.state = 'sweep'; boss.diveTimer = [330, 280, 230][ph-1]; boss.burstTimer = 70; }
                break;
        }
    }
    bossContact();

    for (let i = boss.projectiles.length - 1; i >= 0; i--) {
        const p = boss.projectiles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g === undefined ? 0.05 : p.g) * dt; p.life -= dt; p.rot += 0.15 * dt;
        if (p.life <= 0 || p.x < camera.x - 100 || p.x > camera.x + VIEW_W + 100 || p.y > VIEW_H + 40) { boss.projectiles.splice(i, 1); continue; }
        if (p.x + p.r > player.x && p.x - p.r < player.x + player.w && p.y + p.r > player.y && p.y - p.r < player.y + player.h) {
            if (player.invulnerableTimer <= 0 && !testCheats.invincible) { damagePlayer(1, p.x, p.y); boss.projectiles.splice(i, 1); continue; }
        }
        if (Math.random() < 0.3) addParticles(p.x, p.y, 1, p.wave ? '#c4b5fd' : '#a855f7', 3, true);
    }
    for (let i = boss.shards.length - 1; i >= 0; i--) {
        const s = boss.shards[i];
        if (s.warn > 0) { s.warn -= dt; if (s.warn <= 0) { s.strike = 18; camera.shake = Math.max(camera.shake, 7); sfx.crumble(); } }
        else {
            s.strike -= dt;
            if (!s.hit && player.x + player.w > s.x - 20 && player.x < s.x + 20 && player.invulnerableTimer <= 0 && !testCheats.invincible) { s.hit = true; damagePlayer(1, s.x, player.y); }
            if (s.strike <= 0) boss.shards.splice(i, 1);
        }
    }
}

function roundedRect(c, x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    c.beginPath(); c.moveTo(x + r[0], y); c.lineTo(x + w - r[1], y);
    c.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    c.lineTo(x + w, y + h - r[2]); c.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    c.lineTo(x + r[3], y + h); c.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    c.lineTo(x, y + r[0]); c.quadraticCurveTo(x, y, x + r[0], y); c.closePath();
}

        ctx.font = '26px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(t.icon, x + 14, y + 33);
        ctx.fillStyle = 'rgba(253,224,71,0.8)'; ctx.font = `11px ${FONT}`; ctx.fillText('ДОСТИЖЕНИЕ', x + 56, y + 18);
        ctx.fillStyle = '#fff'; ctx.font = `bold 16px ${FONT}`; ctx.fillText(t.name, x + 56, y + 38);
        ctx.restore();
    });
}
function drawPauseOverlay() {
    ctx.save(); ctx.fillStyle = 'rgba(2,8,12,0.78)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#a7f3d0'; ctx.font = `bold 42px ${FONT}`;

        const hot = pauseHover === i; panel(r.x, r.y, r.w, r.h, hot, 12);
        ctx.fillStyle = hot ? '#fde047' : '#a7f3d0'; ctx.font = `bold 19px ${FONT}`; ctx.fillText(PAUSE_ITEMS[i].label, VIEW_W/2, r.y + 30);
    });
    ctx.fillStyle = 'rgba(167,243,208,0.6)'; ctx.font = `12px ${FONT}`; ctx.fillText('↑↓ + Enter · P / Esc — продолжить', VIEW_W/2, VIEW_H - 24);
    ctx.restore();
}
function drawLevelCompleteOverlay() {
    const o = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, 40, VIEW_W/2, VIEW_H/2, VIEW_W/2);
    o.addColorStop(0, 'rgba(2,44,34,0.88)'); o.addColorStop(1, 'rgba(0,4,8,0.97)');
    ctx.fillStyle = o; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = 'center'; const pulse = 0.6+0.4*Math.sin(globalTime*0.08);
    ctx.shadowColor = 'rgba(253,224,71,0.9)'; ctx.shadowBlur = 25*pulse;
    ctx.fillStyle = '#fde047'; ctx.font = `bold 30px ${FONT}`; ctx.fillText(`${currentLevel.chapter} ПРОЙДЕНА!`, VIEW_W/2, VIEW_H/2 - 118);
    ctx.shadowBlur = 0; ctx.fillStyle = '#a7f3d0'; ctx.font = `18px ${FONT}`; ctx.fillText(currentLevel.name, VIEW_W/2, VIEW_H/2 - 86);
    ctx.fillStyle = '#fde047'; ctx.font = `16px ${FONT}`;
    ctx.fillText(`Искры: ${lumsThisLevel}/${activeLums.length} · Время: ${(levelFrames/60).toFixed(1)}с · Урон: ${hitsThisLevel} · Падений: ${deathsThisLevel}`, VIEW_W/2, VIEW_H/2 - 52);
    const hasSecret = secrets.length > 0;
    ctx.fillStyle = 'rgba(167,243,208,0.9)'; ctx.font = `14px ${FONT}`;
    ctx.fillText(`${hasSecret ? (levelSecretGot || progress.secrets[currentLevelIndex] ? '⭐ Секрет найден' : '☆ Секрет не найден') : ''}  ·  Макс. комбо: ${maxCombo}  ·  Глава ${currentLevelIndex + 1}/8`, VIEW_W/2, VIEW_H/2 - 26);
    ctx.fillStyle = 'rgba(253,224,71,0.9)'; ctx.font = `italic 17px ${FONT}`;
    currentLevel.outroText.split('\n').forEach((line, i) => ctx.fillText(line, VIEW_W/2, VIEW_H/2 + 22 + i*24));
    const r = nextRect(), isLast = currentLevelIndex + 1 >= LEVELS.length;
    panel(r.x, r.y, r.w, r.h, true, 12);
    ctx.fillStyle = `rgba(253,224,71,${0.7 + 0.3*Math.sin(globalTime*0.12)})`; ctx.font = `bold 16px ${FONT}`;
    ctx.fillText(isLast ? '[ ПРОБЕЛ ] Завершить игру' : '[ ПРОБЕЛ ] Следующая глава ▶', VIEW_W/2, r.y + 27);
    ctx.textAlign = 'left';
}
function drawEndOverlay() {
    const o = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, 40, VIEW_W/2, VIEW_H/2, VIEW_W/2);
    o.addColorStop(0, isGameWon ? 'rgba(2,44,34,0.9)' : 'rgba(30,5,5,0.92)'); o.addColorStop(1, 'rgba(0,4,8,0.98)');
    ctx.fillStyle = o; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = 'center'; const pulse = 0.6+0.4*Math.sin(globalTime*0.08);
    ctx.shadowColor = isGameWon ? 'rgba(52,211,153,0.9)' : 'rgba(244,63,94,0.9)'; ctx.shadowBlur = 25*pulse;
    ctx.fillStyle = isGameWon ? '#6ee7b7' : '#fda4af'; ctx.font = `bold 32px ${FONT}`;
    ctx.fillText(isGameWon ? '✨ ПОБЕДА! ✨' : '💀 ИГРА ОКОНЧЕНА', VIEW_W/2, VIEW_H/2 - 150);
    ctx.shadowBlur = 0;
    if (isGameWon) {
        ctx.fillStyle = 'rgba(253,224,71,0.85)'; ctx.font = `italic 16px ${FONT}`;
        currentLevel.outroText.split('\n').forEach((line, i) => ctx.fillText(line, VIEW_W/2, VIEW_H/2 - 112 + i*22));
    }
    ctx.fillStyle = '#fde047'; ctx.font = `16px ${FONT}`;
    if (isGameWon) ctx.fillText(`Всего искр: ${score} · Время: ${finalTime.toFixed(1)}с · Падений: ${deathsThisRun} · Ударов: ${hitsThisRun}`, VIEW_W/2, VIEW_H/2 - 60);
    else ctx.fillText(`Глава ${currentLevelIndex + 1}/8: ${lumsThisLevel}/${activeLums.length} искр · Падений: ${deathsThisRun}`, VIEW_W/2, VIEW_H/2 - 60);
    if (isGameWon && finalRank) {
        const rc = RANK_COLORS[finalRank];
        ctx.fillStyle = 'rgba(253,224,71,0.6)'; ctx.font = `13px ${FONT}`; ctx.fillText('ФИНАЛЬНЫЙ РАНГ', VIEW_W/2, VIEW_H/2 - 30);
        const rp = 1 + 0.05*Math.sin(globalTime*0.15);
        ctx.save(); ctx.translate(VIEW_W/2, VIEW_H/2 + 40); ctx.scale(rp, rp);
        ctx.fillStyle = rc; ctx.shadowColor = rc; ctx.shadowBlur = 45; ctx.font = `bold 78px ${FONT}`; ctx.fillText(finalRank, 0, 0); ctx.restore();
        ctx.shadowBlur = 0; ctx.fillStyle = rc; ctx.font = `15px ${FONT}`; ctx.fillText(RANK_DESCR[finalRank], VIEW_W/2, VIEW_H/2 + 80);
    }
    ctx.fillStyle = 'rgba(167,243,208,0.85)'; ctx.font = `14px ${FONT}`;
    ctx.fillText(`🏆 Рекорд: ${saveData.bestScore} искр · Лучший ранг: ${saveData.bestRank}`, VIEW_W/2, VIEW_H/2 + 125);
    endRects().forEach(r => {
        panel(r.x, r.y, r.w, r.h, r.id === 'retry', 12);
        ctx.fillStyle = r.id === 'retry' ? '#fde047' : '#a7f3d0'; ctx.font = `bold 16px ${FONT}`;
        ctx.fillText(r.id === 'retry' ? '↻ Заново [R]' : '⌂ В меню [Esc]', r.x + r.w/2, r.y + 27);
    });
    ctx.textAlign = 'left';
}
function drawTestPanel() {
    const px = 14, py = 96, pw = 262, rowH = 20, ph = 50 + (warpPoints.length + 6)*rowH + 20;
    ctx.save();
    ctx.fillStyle = 'rgba(2,10,20,0.9)'; roundedRect(ctx, px, py, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(168,85,247,0.8)'; ctx.lineWidth = 2; roundedRect(ctx, px, py, pw, ph, 12); ctx.stroke();
    ctx.fillStyle = '#f0abfc'; ctx.font = `bold 15px ${FONT}`; ctx.fillText(`⚙ TEST — ГЛАВА ${currentLevelIndex + 1}/8`, px+12, py+22);
    ctx.font = `12px ${FONT}`;
    ctx.fillStyle = 'rgba(253,224,71,0.85)'; ctx.fillText('— ТЕЛЕПОРТ [1–7] —', px+12, py+42);
    warpPoints.forEach((wp, i) => { const ry = py + 56 + i*rowH; ctx.fillStyle = '#67e8f9'; ctx.fillText(`[${wp.key}]`, px+14, ry+12); ctx.fillStyle = '#a7f3d0'; ctx.fillText(wp.name, px+52, ry+12); });
    const cy = py + 56 + warpPoints.length*rowH + 10;
    ctx.fillStyle = 'rgba(253,224,71,0.85)'; ctx.fillText('— ЧИТЫ —', px+12, cy);
    ctx.fillStyle = testCheats.invincible ? '#6ee7b7' : 'rgba(167,243,208,0.55)'; ctx.fillText('[I] 🛡 Бессмертие', px+12, cy+18);
    ctx.fillStyle = testCheats.infiniteLives ? '#6ee7b7' : 'rgba(167,243,208,0.55)'; ctx.fillText('[G] ♾ Жизни', px+148, cy+18);
    ctx.fillStyle = 'rgba(167,243,208,0.9)'; ctx.fillText('[K] Убить босса', px+12, cy+36); ctx.fillText('[L] Все искры', px+148, cy+36);
    ctx.fillText('[H] Сердце', px+12, cy+54); ctx.fillText('[Y] Крылья', px+148, cy+54);
    ctx.fillText('[B] К арене босса', px+12, cy+72);
    ctx.fillStyle = '#fde047'; ctx.fillText('[N] ➡ Следующая', px+148, cy+72);

// ═══════════════════════════════════════════════════════════════
// MAIN DRAW
// ═══════════════════════════════════════════════════════════════
function draw() {
    if (appState !== 'playing') {
        uiTime += 1;
        if (appState === 'menu') drawMenu();
        else if (appState === 'chapters') drawChapters();
        else if (appState === 'settings') drawSettings();
        else if (appState === 'ach') drawAchievements();
        drawAchToasts();
        return;
    }
    const c = sceneCtx;
    drawSky(c); drawSkyStars(c); drawClouds(c); drawFarMountains(c); drawMidHills(c); drawNearTrees(c); drawFogLayer(c);

    const shakeX = camera.shake ? (Math.random()-0.5)*camera.shake : 0;
    const shakeY = camera.shake ? (Math.random()-0.5)*camera.shake : 0;

    c.save(); c.translate(-camera.x + shakeX, -camera.y + shakeY + camera.breath);
    drawCrystalLights(c); drawFloatingRocks(c);
    for (const p of platforms) if (p.x + p.w > camera.x - 60 && p.x < camera.x + VIEW_W + 60) drawPlatform(c, p);
    drawVines(c); drawSpikes(c); drawCheckpoints(c); drawGrass(c); drawWater(c); drawPortal(c);
    drawCritters(c); drawFireflies(c); drawTrail(c); drawSecrets(c); drawLums(c); drawPickups(c);
    drawEnemies(c); drawFlyers(c); drawBoss(c); drawPlayer(c); drawPlayerMeters(c);
    for (const p of particles) {
        if (p.x < camera.x - 30 || p.x > camera.x + VIEW_W + 30) continue;
        const a = Math.max(0, p.life/p.maxLife);
        c.fillStyle = p.color;
        if (p.glow) { c.globalAlpha = a * 0.3; c.fillRect(p.x - p.size, p.y - p.size, p.size*2, p.size*2); }
        c.globalAlpha = a; c.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    c.globalAlpha = 1; c.restore();

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(sceneCanvas, 0, 0);
    applyBloom(); applyColorGrade(); applyFilmGrain(); applyVignette(); applyDamageFlash();

    if (deathFade > 0) { ctx.save(); ctx.fillStyle = `rgba(0,0,0,${deathFade*0.8})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.restore(); }
    if (transitionAlpha > 0) { ctx.save(); ctx.fillStyle = `rgba(0,0,0,${transitionAlpha})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.restore(); }

    drawOffscreenMarkers(); drawMinimap(); drawScorePopups(); drawTutorial(); drawTips();
    if (boss.cfg && boss.active && !boss.defeated) drawBossHealthBar();
    drawIntroBanner(); drawBossBanner();
    if (levelComplete) drawLevelCompleteOverlay();
    if (isGameOver || isGameWon) drawEndOverlay();
    if (isPaused) drawPauseOverlay();
    if (testMode) drawTestPanel();
    if (testToast && testToast.timer > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, testToast.timer/20); ctx.textAlign = 'center';
        ctx.fillStyle = '#fde047'; ctx.font = `bold 20px ${FONT}`; ctx.fillText(testToast.text, VIEW_W/2, 130); ctx.restore();
    }
    drawAchToasts();
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
let lastTime = performance.now(), accumulator = 0;
const FIXED_DT = 1000/60;
let frameTimeAvg = 16, slowFrames = 0;
function tickUI(dt) {
    for (let i = achToasts.length - 1; i >= 0; i--) { achToasts[i].timer -= dt; if (achToasts[i].timer <= 0) achToasts.splice(i, 1); }
    if (resetArmed > 0) resetArmed -= dt;
}
function loop(timestamp) {
    const rawDt = timestamp - lastTime; lastTime = timestamp;
    const dt = Math.min(rawDt, 50); accumulator += dt;
    if (accumulator > FIXED_DT * 3) accumulator = FIXED_DT;
    let steps = 0;
    while (accumulator >= FIXED_DT && steps < 3) { update(1); tickUI(1); accumulator -= FIXED_DT; steps++; }
    frameTimeAvg = frameTimeAvg * 0.9 + rawDt * 0.1;
    if (!autoLow && frameTimeAvg > 40) { slowFrames++; if (slowFrames > 30) { autoLow = true; applyQuality(); } }
    else slowFrames = Math.max(0, slowFrames - 1);
    try { draw(); } catch(e) { console.error('Draw error:', e); }
    requestAnimationFrame(loop);
}


// START
initGame(0);
go('menu');
requestAnimationFrame(t => { lastTime = t; loop(t); });

})();
</script>
