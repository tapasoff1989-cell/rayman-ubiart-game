<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rayman Adventures: UbiArt Ultimate V7</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000408;
            color: #fff;
            font-family: 'Fredoka One', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .game-container {
            position: relative;
            background: #020b14;
            padding: 16px;
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 60px rgba(52, 211, 153, 0.2);
            border: 3px solid rgba(52, 211, 153, 0.4);
        }
        canvas {
            display: block;
            border-radius: 18px;
        }
        .hud-bar {
            position: absolute;
            top: 26px;
            left: 26px;
            right: 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-pill {
            background: rgba(2, 34, 26, 0.88);
            border: 2px solid #34d399;
            padding: 7px 16px;
            border-radius: 14px;
            font-size: 14px;
            color: #a7f3d0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        .controls-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #34d399;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud-bar">
            <div class="hud-pill">🌿 UBIART V7 (60 FPS)</div>
            <div class="hud-pill">✨ ЛУМЫ: <span id="score" style="color: #fde047;">0</span> / <span id="maxScore">12</span></div>
            <div class="hud-pill">ЖИЗНИ: <span id="lives" style="color: #f43f5e;">❤️❤️❤️</span></div>
        </div>
        <canvas id="gameCanvas" width="840" height="470"></canvas>
    </div>

    <div class="controls-hint">
        Управление: <b>A / D</b> — Бег | <b>W / ПРОБЕЛ</b> — Прыжок (удерживай для планирования) | <b>[ R ]</b> — Перезапуск
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isGameWon = false;
        let globalTime = 0;

        let camera = {
            x: 0,
            y: 0,
            width: 840,
            height: 470,
            worldWidth: 3800
        };

        const platforms = [
            {x: 0, y: 390, w: 920, h: 80, type: 'ground'},
            {x: 360, y: 260, w: 230, h: 32, type: 'branch'},
            {x: 750, y: 340, w: 380, h: 80, type: 'ground'},
            {x: 1190, y: 220, w: 270, h: 32, type: 'branch'},
            {x: 1570, y: 320, w: 330, h: 80, type: 'ground'},
            {x: 1990, y: 200, w: 260, h: 32, type: 'branch'},
            {x: 2390, y: 290, w: 1400, h: 100, type: 'ground'}
        ];

        let lumsData = [
            {x: 420, y: 190}, {x: 475, y: 165}, {x: 530, y: 190},
            {x: 880, y: 270}, {x: 940, y: 245},
            {x: 1280, y: 150}, {x: 1340, y: 125},
            {x: 1690, y: 240}, {x: 1750, y: 215}, {x: 1810, y: 240},
            {x: 2100, y: 130}, {x: 2520, y: 190}
        ];

        let enemiesData = [
            {x: 850, y: 300, w: 48, h: 48, minX: 790, maxX: 1080, speed: 2.2, dir: 1},
            {x: 1670, y: 270, w: 48, h: 48, minX: 1610, maxX: 1860, speed: 2.5, dir: 1},
            {x: 2560, y: 240, w: 48, h: 48, minX: 2450, maxX: 3200, speed: 2.9, dir: 1}
        ];

        let player = {
            x: 120, y: 280,
            w: 42, h: 62,
            vx: 0, vy: 0,
            speed: 6.2,
            jumpForce: -13.5,
            gravity: 0.52,
            isGrounded: false,
            isHovering: false,
            facing: 1,
            squashX: 1,
            squashY: 1,
            invulnerableTimer: 0,
            animTimer: 0,
            earLag: 0
        };

        let activeLums = [];
        let activeEnemies = [];
        let particles = [];
        let grassTufts = [];
        let keys = { left: false, right: false, jump: false };

        platforms.forEach(plat => {
            if (plat.type === 'ground') {
                for (let tx = plat.x + 15; tx < plat.x + plat.w - 15; tx += 32) {
                    grassTufts.push({
                        x: tx,
                        y: plat.y,
                        width: 28 + Math.random() * 16,
                        height: 22 + Math.random() * 16,
                        phase: Math.random() * Math.PI * 2,
                        frequency: 0.04 + Math.random() * 0.02,
                        color: Math.random() > 0.5 ? '#10b981' : '#059669'
                    });
                }
            }
        });

        function initGame() {
            activeLums = lumsData.map(l => ({ x: l.x, y: l.y, collected: false, offset: Math.random() * 10 }));
            activeEnemies = JSON.parse(JSON.stringify(enemiesData));
            document.getElementById('maxScore').innerText = activeLums.length;
            score = 0;
            player.x = 120; player.y = 280; player.vx = 0; player.vy = 0;
            updateHUD();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'w' || e.key === ' ' || e.key === 'ArrowUp') keys.jump = true;
            if (e.key.toLowerCase() === 'r' && (isGameOver || isGameWon)) {
                lives = 3; isGameOver = false; isGameWon = false; initGame();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'w' || e.key === ' ' || e.key === 'ArrowUp') keys.jump = false;
        });

        function addParticles(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.7) * 8,
                    color: color,
                    life: 20 + Math.random() * 10,
                    size: Math.random() * 3 + 2,
                });
            }
        }

        function update() {
            if (isGameOver || isGameWon) return;
            globalTime++;

            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            player.squashX += (1 - player.squashX) * 0.15;
            player.squashY += (1 - player.squashY) * 0.15;

            if (keys.left) { player.vx = -player.speed; player.facing = -1; player.animTimer += 0.2; }
            else if (keys.right) { player.vx = player.speed; player.facing = 1; player.animTimer += 0.2; }
            else { player.vx = 0; player.animTimer = 0; }

            if (keys.jump) {
                if (player.isGrounded) {
                    player.vy = player.jumpForce;
                    player.isGrounded = false;
                    player.squashX = 0.6;
                    player.squashY = 1.5;
                    addParticles(player.x + player.w/2, player.y + player.h, 14, '#34d399');
                } else if (player.vy > 0) {
                    player.isHovering = true;
                    player.vy = 0.75;
                }
            } else {
                player.isHovering = false;
            }

            if (!player.isHovering) player.vy += player.gravity;

            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x > camera.worldWidth - player.w) player.x = camera.worldWidth - player.w;

            let wasGrounded = player.isGrounded;
            player.isGrounded = false;

            platforms.forEach(plat => {
                if (
                    player.x + player.w > plat.x &&
                    player.x < plat.x + plat.w &&
                    player.y + player.h >= plat.y &&
                    player.y + player.h - player.vy <= plat.y + 18 &&
                    player.vy >= 0
                ) {
                    player.y = plat.y - player.h;
                    if (!wasGrounded && player.vy > 3) {
                        player.squashX = 1.35;
                        player.squashY = 0.7;
                    }
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            activeEnemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x < en.minX || en.x > en.maxX) en.dir *= -1;

                if (
                    player.invulnerableTimer === 0 &&
                    player.x + player.w > en.x + 6 &&
                    player.x < en.x + en.w - 6 &&
                    player.y + player.h > en.y + 6 &&
                    player.y < en.y + en.h
                ) {
                    lives--;
                    player.invulnerableTimer = 65;
                    updateHUD();
                    addParticles(player.x + player.w/2, player.y + player.h/2, 18, '#ef4444');
                    player.vy = -7.0;
                    player.vx = player.facing * -6.5;
                    if (lives <= 0) isGameOver = true;
                }
            });

            if (player.y > 480) {
                lives--;
                updateHUD();
                if (lives <= 0) isGameOver = true;
                else { player.x = 120; player.y = 200; player.vy = 0; }
            }

            activeLums.forEach(lum => {
                if (!lum.collected) {
                    let dx = (player.x + player.w/2) - lum.x;
                    let dy = (player.y + player.h/2) - lum.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 42) {
                        lum.collected = true;
                        score++;
                        addParticles(lum.x, lum.y, 18, '#fde047');
                        updateHUD();
                        if (score >= activeLums.length) isGameWon = true;
                    }
                }
            });

            let targetCamX = player.x - camera.width / 2.5;
            targetCamX = Math.max(0, Math.min(targetCamX, camera.worldWidth - camera.width));
            camera.x += (targetCamX - camera.x) * 0.1;

            particles.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if(p.life <= 0) particles.splice(idx, 1);
            });
        }

        function draw() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, camera.height);
            skyGrad.addColorStop(0, '#001410');
            skyGrad.addColorStop(1, '#000604');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, camera.width, camera.height);

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            platforms.forEach(plat => {
                if (plat.type === 'ground') {
                    ctx.fillStyle = '#065f46';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, [16, 16, 0, 0]);
                    ctx.fill();
                    ctx.fillStyle = '#022c22';
                    ctx.fillRect(plat.x, plat.y + plat.h - 12, plat.w, 12);
                } else {
                    ctx.fillStyle = '#b45309';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 14);
                    ctx.fill();
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(plat.x, plat.y + plat.h - 8, plat.w, 8);
                }
            });

            grassTufts.forEach(t => {
                let sway = Math.sin(globalTime * t.frequency + t.phase) * 7;
                let dx = (player.x + player.w/2) - t.x;
                let push = (Math.abs(dx) < 40 && player.isGrounded) ? (40 - Math.abs(dx)) * (dx > 0 ? -0.45 : 0.45) : 0;
                let topX = t.x + sway + push;
                let topY = t.y - t.height;

                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.moveTo(t.x - t.width/2, t.y);
                ctx.quadraticCurveTo(topX - 4, topY + t.height/2, topX, topY);
                ctx.quadraticCurveTo(topX + 4, topY + t.height/2, t.x + t.width/2, t.y);
                ctx.closePath();
                ctx.fill();
            });

            activeLums.forEach(lum => {
                if (!lum.collected) {
                    let floatY = lum.y + Math.sin(globalTime * 0.12 + lum.offset) * 6;
                    
                    ctx.fillStyle = 'rgba(234, 179, 8, 0.25)';
                    ctx.beginPath();
                    ctx.arc(lum.x, floatY, 20, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(lum.x, floatY, 9, 0, Math.PI*2);
                    ctx.fill();
                }
            });

            activeEnemies.forEach(en => {
                ctx.fillStyle = '#991b1b';
                ctx.beginPath();
                ctx.roundRect(en.x, en.y, en.w, en.h, 14);
                ctx.fill();
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(en.x + 32, en.y + 16, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(en.x + 34, en.y + 16, 2.5, 0, Math.PI*2);
                ctx.fill();
            });

            if (player.invulnerableTimer % 6 < 3) {
                ctx.save();
                ctx.translate(player.x + player.w/2, player.y + player.h);
                if (player.facing === -1) ctx.scale(-1, 1);
                ctx.scale(player.squashX, player.squashY);

                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 16, 5, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.roundRect(-16, -46, 32, 38, 12);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.roundRect(-18, -50, 36, 10, 4);
                ctx.fill();

                ctx.fillStyle = '#fdba74';
                ctx.beginPath();
                ctx.arc(0, -60, 15, 0, Math.PI*2);
                ctx.fill();

                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(-2, -72, 12, Math.PI, Math.PI*2);
                ctx.fill();

                if (player.isHovering) {
                    player.earLag += (0.9 - player.earLag) * 0.2;
                    let earAngle = Math.sin(globalTime * 0.9) * 0.7 * player.earLag;
                    ctx.save();
                    ctx.translate(0, -72);
                    ctx.rotate(earAngle);
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.ellipse(28, -4, 32, 8, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    player.earLag = 0;
                }

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(5, -61, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#011c16';
                ctx.beginPath();
                ctx.arc(7, -61, 2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            ctx.restore();

            if (isGameOver || isGameWon) {
                ctx.fillStyle = 'rgba(0, 6, 12, 0.92)';
                ctx.fillRect(0, 0, camera.width, camera.height);

                ctx.textAlign = 'center';
                ctx.fillStyle = isGameWon ? '#34d399' : '#f43f5e';
                ctx.font = 'bold 26px "Fredoka One", cursive';
                ctx.fillText(isGameWon ? '✨ УРОВЕНЬ ПРОЙДЕН! ✨' : 'ВЫ УПАЛИ В УЩЕЛЬЕ', camera.width/2, camera.height/2 - 20);

                ctx.fillStyle = '#fde047';
                ctx.font = '15px "Fredoka One", cursive';
                ctx.fillText(isGameWon ? 'Отличная пробежка в 60 FPS!' : 'Попробуйте еще раз', camera.width/2, camera.height/2 + 20);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '12px "Fredoka One", cursive';
                ctx.fillText('Нажмите [ R ] для перезапуска', camera.width/2, camera.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            document.getElementById('lives').innerText = hearts;
        }

        initGame();

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
